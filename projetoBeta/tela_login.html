<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <a href="src/css/style.css"></a>
    <title>EscreveBem</title>
</head>

<body>
    <header>
        <h1>Portal do Estudante</h1>
     
    </header>

    <main>
        <fieldset>

            <form action="estudoenem.html" method="get">
                <label for="nome_usuario">Nome do Estudante</label><br>
                <input type="text" id="nome_usuario" placeholder="Celso..."> <br>
                <label for="email">E-mail</label><br>
                <input type="email" placeholder="@gmail.com"><br>
                <label for="senha_secreta">Senha</label><br>
                <input type="password" placeholder="1234"><br>
                Clique em acessar para ser redirecionado! <br>
                <button type="submit"> Acessar </button>
            </form>
        </fieldset>
    </main>

</body>
</html>
